<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="tg-max-mcp — Telegram и MAX в ChatGPT, Claude и любом MCP-клиенте">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#151a3a"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb4f0"/>
      <stop offset="1" stop-color="#1f86d6"/>
    </linearGradient>
    <linearGradient id="mx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b3fd9"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3a6"/>
      <stop offset="1" stop-color="#0ea5a0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>

  <!-- текст -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="150" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">tg-max-mcp</text>
    <text x="74" y="200" font-size="26" fill="#c7d2fe">Telegram + MAX в ChatGPT, Claude</text>
    <text x="74" y="236" font-size="26" fill="#c7d2fe">и любом MCP-клиенте</text>
    <g font-size="17" font-weight="600">
      <rect x="74" y="270" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="149" y="294" fill="#e0e7ff" text-anchor="middle">61 инструмент</text>
      <rect x="236" y="270" width="176" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="324" y="294" fill="#e0e7ff" text-anchor="middle">на вашем сервере</text>
      <rect x="424" y="270" width="96" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="472" y="294" fill="#e0e7ff" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- схема: два мессенджера → MCP → ассистенты -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M858 118 C 930 118, 930 180, 990 180" stroke="#3fb4f0" stroke-opacity="0.7"/>
    <path d="M858 252 C 930 252, 930 180, 990 180" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <path d="M1078 180 L 1128 180" stroke="#22d3a6" stroke-opacity="0.8" stroke-dasharray="2 8"/>
  </g>

  <!-- пузырь Telegram -->
  <g>
    <path d="M700 80 h140 a22 22 0 0 1 22 22 v32 a22 22 0 0 1 -22 22 h-110 l-22 16 v-16 h-8 a22 22 0 0 1 -22 -22 v-32 a22 22 0 0 1 22 -22 z" fill="url(#tg)"/>
    <text x="770" y="127" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Telegram</text>
  </g>
  <!-- пузырь MAX -->
  <g>
    <path d="M700 214 h140 a22 22 0 0 1 22 22 v32 a22 22 0 0 1 -22 22 h-110 l-22 16 v-16 h-8 a22 22 0 0 1 -22 -22 v-32 a22 22 0 0 1 22 -22 z" fill="url(#mx)"/>
    <text x="770" y="261" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">MAX</text>
  </g>

  <!-- MCP -->
  <circle cx="1034" cy="180" r="44" fill="url(#hub)"/>
  <text x="1034" y="189" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#06281f" text-anchor="middle">MCP</text>

  <!-- ассистенты -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#e0e7ff">
    <rect x="1136" y="120" width="112" height="34" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="1192" y="143" text-anchor="middle">ChatGPT</text>
    <rect x="1136" y="163" width="112" height="34" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="1192" y="186" text-anchor="middle">Claude</text>
    <rect x="1136" y="206" width="112" height="34" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="1192" y="229" text-anchor="middle">Cursor…</text>
  </g>
</svg>
